<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Base hexagon -->
  <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="url(#bg)" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner hexagon -->
  <polygon points="50,12 88,30 88,70 50,88 12,70 12,30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <!-- Top crystal accent -->
  <polygon points="50,15 55,22 45,22" fill="#8b5cf6" opacity="0.8"/>
  <!-- Bottom crystal accent -->
  <polygon points="50,85 55,78 45,78" fill="#8b5cf6" opacity="0.8"/>
  <!-- Text -->
  <text x="50" y="52" font-family="Impact, 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">300</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#8b5cf6" text-anchor="middle" letter-spacing="2">DAYS</text>
</svg>