<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Base diamond -->
  <polygon points="50,5 95,50 50,95 5,50" fill="url(#bg)" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner diamond -->
  <polygon points="50,15 85,50 50,85 15,50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <!-- Top and bottom glowing dots -->
  <circle cx="50" cy="15" r="3" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="50" cy="85" r="3" fill="#f59e0b" filter="url(#glow)"/>
  <!-- Text -->
  <text x="50" y="48" font-family="Impact, 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">365</text>
  <text x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1">DIARIES</text>
</svg>